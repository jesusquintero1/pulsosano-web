config:
  max_noticias_por_run: 12
  max_por_fuente: 2
  modelo: "claude-haiku-4-5"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

# Fuentes verificadas el 2026-05-18. Si un feed comienza a fallar, marcar activa:false.
fuentes:
  # === Inglés — autoridad alta ===
  - nombre: "MedlinePlus News (NIH)"
    url: "https://medlineplus.gov/groupfeeds/new.xml"
    idioma: "en"
    peso: 5
    activa: true

  - nombre: "World Health Organization"
    url: "https://www.who.int/rss-feeds/news-english.xml"
    idioma: "en"
    peso: 5
    activa: true

  - nombre: "ScienceDaily Health & Medicine"
    url: "https://www.sciencedaily.com/rss/health_medicine.xml"
    idioma: "en"
    peso: 4
    activa: true

  - nombre: "ScienceDaily Nutrition"
    url: "https://www.sciencedaily.com/rss/health_medicine/nutrition.xml"
    idioma: "en"
    peso: 4
    activa: true

  - nombre: "ScienceDaily Mind & Brain"
    url: "https://www.sciencedaily.com/rss/mind_brain.xml"
    idioma: "en"
    peso: 4
    activa: true

  - nombre: "BBC Health"
    url: "http://feeds.bbci.co.uk/news/health/rss.xml"
    idioma: "en"
    peso: 4
    activa: true

  - nombre: "The New York Times Health"
    url: "https://rss.nytimes.com/services/xml/rss/nyt/Health.xml"
    idioma: "en"
    peso: 4
    activa: true

  - nombre: "STAT News"
    url: "https://www.statnews.com/feed/"
    idioma: "en"
    peso: 5
    activa: true

  - nombre: "Healthline News"
    url: "https://www.healthline.com/rss/health-news"
    idioma: "en"
    peso: 4
    activa: true

  # === Español — prioridad SEO LatAm ===
  - nombre: "Diario Médico"
    url: "https://www.diariomedico.com/rss/portada.xml"
    idioma: "es"
    peso: 5
    activa: true

  - nombre: "Cuídate Plus"
    url: "https://cuidateplus.marca.com/rss"
    idioma: "es"
    peso: 4
    activa: true

  - nombre: "El Mundo Salud"
    url: "https://e00-elmundo.uecdn.es/elmundosalud/rss/portada.xml"
    idioma: "es"
    peso: 4
    activa: true

  - nombre: "20Minutos Salud"
    url: "https://www.20minutos.es/rss/salud/"
    idioma: "es"
    peso: 3
    activa: true

  # === Inactivas — bloquean al user-agent del bot (revisar manualmente más tarde) ===
  - nombre: "Harvard Health Blog"
    url: "https://www.health.harvard.edu/blog/feed"
    idioma: "en"
    peso: 5
    activa: false   # 404 al user-agent del bot (2026-05-18)

  - nombre: "Mayo Clinic News"
    url: "https://newsnetwork.mayoclinic.org/feed/"
    idioma: "en"
    peso: 5
    activa: false   # 403 (bloqueo de bot)

  - nombre: "Cleveland Clinic Health Essentials"
    url: "https://health.clevelandclinic.org/feed/"
    idioma: "en"
    peso: 4
    activa: false   # 404 al user-agent del bot

  - nombre: "Medical News Today"
    url: "https://www.medicalnewstoday.com/rss"
    idioma: "en"
    peso: 4
    activa: false   # 403/404 al user-agent del bot

  - nombre: "Infosalus (Europa Press)"
    url: "https://www.infosalus.com/rss/seccion-salud.xml"
    idioma: "es"
    peso: 5
    activa: false   # HTTP 200 pero feed sin items

  - nombre: "EFE Salud"
    url: "https://efesalud.com/feed/"
    idioma: "es"
    peso: 5
    activa: false   # 429 (rate limit estricto)
