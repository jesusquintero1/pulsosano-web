config:
  max_noticias_por_run: 5           # cap por run; con cron 12h = ~10/día (recorte costos API 2026-06-26)
  max_por_fuente: 2
  modelo: "claude-haiku-4-5"        # modelo base (fuentes peso < peso_premium_min)
  modelo_premium: "claude-sonnet-4-6"  # fuentes de máxima autoridad (peer-review, agencias)
  peso_premium_min: 5               # peso >= 5 -> usa modelo_premium
  fetch_fulltext: true              # descargar texto completo de la fuente (calidad + anti-alucinación)
  fulltext_max_chars: 4000          # recorte para acotar tokens (lead/abstract va al inicio)
  fulltext_skip_if_summary_chars: 1400  # si el resumen RSS ya es rico, no fetchear (ahorra tokens)
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

# Fuentes verificadas el 2026-05-18 (segunda ronda con peer-review + LatAm).
# Pesos: 5 = autoridad máxima (NIH, OMS, OPS, journals peer-review)
#        4 = institucional o periodismo médico de calidad
#        3 = divulgación seria
#        2 = prensa generalista (uso limitado)
fuentes:
  # === PEER-REVIEW / Autoridad académica (peso 5) ===
  - nombre: "Nature Medicine"
    url: "https://www.nature.com/nm.rss"
    idioma: "en"
    peso: 5
    activa: true

  - nombre: "BMJ Open"
