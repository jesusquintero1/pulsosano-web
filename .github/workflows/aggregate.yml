name: Agregador de noticias

on:
  schedule:
    # 1 run/día (06:00 UTC). Rescate de calidad 2026-07-09: Google desindexó ~50%
    # y AdSense rechazó por "contenido de poco valor". Menos volumen, más calidad;
    # el corpus (1366 art.) ya sobra — el problema es diferenciación, no cantidad.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Máx. noticias a generar en esta corrida (vacío = usar config)'
        required: false
        default: ''
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'tailwind.config.mjs'
      - 'package.json'
      - 'wrangler.jsonc'
      - 'worker/**'
      - 'redirect/**'

permissions:
  contents: write

concurrency:
  group: pulsosano-build
  cancel-in-progress: false

env:
  SITE_URL: https://pulsosano.com
  PUBLIC_ADSENSE_CLIENT: ${{ secrets.PUBLIC_ADSENSE_CLIENT }}

jobs:
  aggregate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install --quiet -r scripts/requirements.txt

      - name: Run aggregator (skip on push)
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGG_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          if [ -n "${AGG_LIMIT}" ]; then
            python scripts/aggregator.py --limit "${AGG_LIMIT}"
          else
            python scripts/aggregator.py
          fi

      - name: Commit nuevas noticias (si hay)
        if: github.event_name != 'push'
        run: |
          git config user.name "pulsosano-bot"
          git config user.email "bot@pulsosano.com"
          git add src/content/noticias/ scripts/state/processed.json || true
          if ! git diff --cached --quiet; then
            git commit -m "feat(noticias): agregar nuevas noticias automáticas $(date -u +%Y-%m-%dT%H:%M)"
            # El propietario puede haber pusheado entre el checkout y este push.
            git pull --rebase origin main
            git push
          else
            echo "No hay cambios que commitear."
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: npm install --no-audit --no-fund

      - name: Build Astro
        env:
          SITE_URL: https://pulsosano.com
          PUBLIC_ADSENSE_CLIENT: ${{ secrets.PUBLIC_ADSENSE_CLIENT }}
        run: npm run build

      - name: Resolver KV de newsletter (crea el namespace si no existe)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          find_id() {
            curl -sf "${API}?per_page=100" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((n['id'] for n in d.get('result',[]) if n.get('title')=='pulsosano-newsletter'),''))"
          }
          ID="$(find_id)"
          if [ -z "${ID}" ]; then
            echo "Creando KV namespace pulsosano-newsletter…"
            curl -sf -X POST "${API}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" --data '{"title":"pulsosano-newsletter"}' >/dev/null
            ID="$(find_id)"
          fi
          test -n "${ID}" || { echo "No se pudo resolver el id del KV"; exit 1; }
          sed -i "s/__KV_NEWSLETTER_ID__/${ID}/" wrangler.jsonc
          echo "KV NEWSLETTER -> ${ID}"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Deploy redirect worker (pulsosano.org -> pulsosano.com)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: ./redirect
          command: deploy

      - name: Ping IndexNow (Bing + Yandex)
        if: github.event_name != 'push'
        env:
          SITE_URL: https://pulsosano.com
        run: python scripts/indexnow_submit.py || true
